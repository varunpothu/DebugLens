name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Type check
        run: mypy app

  worker-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated worker image
        run: docker build -f runner/Dockerfile -t debuglens-test-worker:ci .
      - name: Run approved suites in network-disabled containers
        shell: bash
        run: |
          set -euo pipefail
          for suite in pytest ruff mypy; do
            echo "Running isolated suite: $suite"
            docker run --rm \
              --init \
              --user 10001:10001 \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --ulimit nofile=1024:1024 \
              --memory 512m \
              --cpus 1 \
              --pids-limit 128 \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
              -e "DEBUGLENS_TEST_SUITE=${suite}" \
              debuglens-test-worker:ci
          done


  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated Terraform validation directory
        run: cp -a infra/terraform "$RUNNER_TEMP/terraform"
      - name: Check Terraform formatting
        run: docker run --rm -v "$RUNNER_TEMP/terraform:/workspace" -w /workspace hashicorp/terraform:1.10 fmt -check -recursive
      - name: Initialise Terraform without a backend
        run: docker run --rm -v "$RUNNER_TEMP/terraform:/workspace" -w /workspace hashicorp/terraform:1.10 init -backend=false -input=false
      - name: Validate Terraform configuration
        run: docker run --rm -v "$RUNNER_TEMP/terraform:/workspace" -w /workspace hashicorp/terraform:1.10 validate


  aws-deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API and UI images
        run: |
          docker build -f Dockerfile -t debuglens-api:ci .
          docker build -f Dockerfile.ui -t debuglens-ui:ci .
      - name: Validate bootstrap script syntax
        run: bash -n infra/terraform/bootstrap.sh.tftpl
      - name: Validate private AWS Compose configuration
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/debuglens.env" <<'EOF'
          DOMAIN_NAME=debuglens.example.com
          COGNITO_ISSUER_URL=https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_example
          COGNITO_CLIENT_ID=example-client-id
          COGNITO_CLIENT_SECRET=example-client-secret
          API_ACCESS_TOKEN=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OAUTH2_PROXY_COOKIE_SECRET=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
          AWS_REGION=eu-west-2
          ANALYSIS_PROVIDER=mock
          VISION_API_KEY=
          EOF
          docker compose --env-file "$RUNNER_TEMP/debuglens.env" -f deploy/compose.aws.yml config --format json > "$RUNNER_TEMP/compose.json"
          python scripts/check_aws_compose.py "$RUNNER_TEMP/compose.json"
