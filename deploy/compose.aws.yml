services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-mock}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN in the protected SSM parameter store}
      API_SERVICE_ACTOR: debuglens-service
      DATABASE_PATH: /data/debuglens.db
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALLOW_UNREDACTED_SCREENSHOTS: "false"
      BROWSER_ENABLED: "false"
      ALLOWED_ORIGINS: https://${DOMAIN_NAME}
    volumes:
      - debuglens_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [app]

  ui:
    build:
      context: ..
      dockerfile: Dockerfile.ui
    init: true
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    environment:
      DEBUGLENS_API_URL: http://api:8000
      DEBUGLENS_API_TOKEN: ${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN in the protected SSM parameter store}
      DEBUGLENS_LOCKED_CONFIG: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    init: true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${COGNITO_ISSUER_URL:?Missing Cognito issuer URL}
      OAUTH2_PROXY_CLIENT_ID: ${COGNITO_CLIENT_ID:?Missing Cognito client ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET:?Missing Cognito client secret}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_REDIRECT_URL: https://${DOMAIN_NAME}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://ui:8501/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?Set OAUTH2_PROXY_COOKIE_SECRET in the protected SSM parameter store}
      OAUTH2_PROXY_COOKIE_NAME: _debuglens_auth
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "false"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${DOMAIN_NAME}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    restart: unless-stopped
    networks: [app]

  proxy:
    image: caddy:2.10.0-alpine
    init: true
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME to a DNS name pointed at this instance}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    depends_on: [auth]
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  debuglens_data:
  caddy_data:
  caddy_config:
