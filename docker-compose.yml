services:
  api:
    build: .
    init: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: local
      DATABASE_PATH: /data/debuglens.db
      BROWSER_ENABLED: "false"
    volumes:
      - debuglens_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  debuglens_data:
